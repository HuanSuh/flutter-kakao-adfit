name: flutter_adfit
description: A flutter package for AdFitSDK provided by kakaoAdFit. (non-official)
version: 1.2.1
homepage: https://github.com/HuanSuh/flutter-kakao-adfit

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  webview_flutter:
  webview_flutter_wkwebview:
  webview_flutter_android:

  flutter_inappwebview:
  flutter_inappwebview_ios:
  flutter_inappwebview_android:
  flutter_inappwebview_platform_interface:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0

flutter:
  plugin:
    platforms:
      android:
        package: flutter.kakao.flutter_adfit
        pluginClass: FlutterAdfitPlugin
      ios:
        pluginClass: FlutterAdfitPlugin
